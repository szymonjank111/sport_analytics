name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # It publishes no major-version tag.
      - run: uv sync --locked
      # The hooks of a local commit, ruff among them, so CI checks no less than they do.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pyright
      - run: uv run pytest

  dbt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token that Workload Identity Federation trades for short-lived GCP credentials.
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt
      DBT_DATASET: ci_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # It publishes no major-version tag.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - run: uv sync --locked
      - run: uv run dbt deps
      - run: uv run dbt build --target ci
      - if: always() && steps.auth.outcome == 'success'
        run: uv run python scripts/drop_ci_datasets.py "$DBT_DATASET"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
      - run: terraform fmt -check -recursive
      # Like uv sync --locked: fails instead of quietly changing the provider versions.
      - run: terraform init -backend=false -lockfile=readonly
      - run: terraform validate
