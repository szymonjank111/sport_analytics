seeds:
  - name: competitions
    description: Competitions the project covers, with their codes in each source.
    config:
      column_types:
        competition_id: string
        name: string
        country: string
        tier: int64
        competition_type: string
        season_calendar: string
        football_data_code: string
        co_uk_code: string
        understat_code: string
        has_xg: bool
        has_match_stats: bool
        has_odds: bool
    columns:
      - name: competition_id
        description: Canonical competition ID, such as ENG1 for the top English league.
        data_tests:
          - unique
          - not_null
      - name: country
        description: Country of a national league; null for an international cup.
      - name: tier
        description: Level in the national league pyramid, 1 for the top flight.
      - name: competition_type
        description: league for a round robin, cup for knockout ties.
        data_tests:
          - accepted_values:
              arguments:
                values: [league, cup]
      - name: season_calendar
        description: split for seasons from autumn to spring, calendar for seasons within a year.
        data_tests:
          - accepted_values:
              arguments:
                values: [split, calendar]
      - name: football_data_code
        description: Competition code in football-data.org.
      - name: co_uk_code
        description: Division code in football-data.co.uk.
      - name: understat_code
        description: League code in Understat.
      - name: has_xg
        description: Whether a source covers xG for the competition.
      - name: has_match_stats
        description: Whether a source covers shots, corners and cards.
      - name: has_odds
        description: Whether a source covers betting odds.

  - name: teams
    description: Canonical clubs, whatever their name in each source.
    columns:
      - name: team_id
        description: Slug of the club name, such as manchester-united.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Club name without affixes such as FC.
      - name: country
        description: Country of the club.

  - name: team_mapping
    description: The canonical club of each team key in each source.
    config:
      column_types:
        source: string
        # Text, like the keys in staging: IDs of one source and names of another share it.
        source_team_key: string
        team_id: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, source_team_key]
    columns:
      - name: source
        description: Source of the key, such as football_data.
      - name: source_team_key
        description: Team ID or name in the source.
      - name: team_id
        description: Canonical club.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('teams')
                field: team_id
