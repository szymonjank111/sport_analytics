sources:
  - name: football_data
    description: Season snapshots from the football-data.org API, one row per match and run.
    schema: "{{ env_var('BQ_RAW_DATASET', 'raw') }}"
    config:
      meta:
        redistribution: public
      loaded_at_field: _loaded_at
      # A round is played every week of a season, so data older than that is stale.
      freshness:
        warn_after: {count: 8, period: day}
        error_after: {count: 15, period: day}
    tables:
      - name: matches
        identifier: football_data__matches
