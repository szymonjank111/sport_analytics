unit_tests:
  - name: matches_come_from_the_latest_snapshot
    model: stg_football_data__matches
    given:
      # SQL, since the other formats cannot express a JSON payload. Fields left out read as null.
      - input: source('football_data', 'matches')
        format: sql
        rows: |
          select
            date '2026-08-21' as _run_date, 'PL' as _competition, 2026 as _season,
            'gs://raw/old.json' as _gcs_uri, timestamp '2026-08-21 06:00:00+00' as _loaded_at,
            json '{"id": 600001, "status": "TIMED", "homeTeam": {"id": 57}}' as payload
          union all
          select
            date '2026-08-23', 'PL', 2026,
            'gs://raw/new.json', timestamp '2026-08-23 06:00:00+00',
            json '{"id": 600001, "status": "FINISHED", "homeTeam": {"id": 57}, "score": {"fullTime": {"home": 2, "away": 1}}}'
    expect:
      rows:
        - {match_id: 600001, status: finished, home_team_key: "57", home_goals: 2, away_goals: 1, run_date: 2026-08-23}
