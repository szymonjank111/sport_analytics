[project]
name = "sport-analytics"
version = "0.1.0"
description = "Football analytics ELT pipeline on BigQuery and dbt"
readme = "README.md"
authors = [
    { name = "Szymon Jankowski", email = "szymonjank99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=3.17.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
]

[project.scripts]
ingest = "sport_analytics.ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "DTZ", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
# For the fakes the tests share, which importlib mode does not put on the path.
pythonpath = ["tests"]
