[project]
name = "sport-analytics"
version = "0.1.0"
description = "Football analytics ELT pipeline on BigQuery and dbt"
readme = "README.md"
authors = [
    { name = "Szymon Jankowski", email = "szymonjank99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "DTZ", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
