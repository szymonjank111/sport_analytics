[project]
name = "sport-analytics"
version = "0.1.0"
description = "Football analytics ELT pipeline on BigQuery and dbt"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Szymon Jankowski", email = "szymonjank99@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=3.1.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "urllib3>=2.8.0",
]

[project.scripts]
ingest = "sport_analytics.ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
app = [
    "google-cloud-bigquery[pandas]>=3.46.2",
    "streamlit>=1.66.1",
]
dbt = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.6",
]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "ruff>=0.17",
    "types-requests>=2.33.0.20261006",
]

[tool.uv]
default-groups = ["dev", "dbt", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PT", "DTZ", "RUF"]

[tool.pyright]
include = ["src", "tests", "app", "scripts"]
extraPaths = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
# For the fakes the tests share and the scripts they test, which importlib mode does not put on
# the path.
pythonpath = ["tests", "scripts"]
